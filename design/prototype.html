<title>Rounds Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@1,400;1,600&display=swap">
<style>
  /* ════════════════════════════════════════════════
     ROUNDS · Ward Board palette, light and dark
     The theme is resolved in script and stamped as
     data-app="light|dark" on the root element.
     ════════════════════════════════════════════════ */
  :root{
    --bg:#EEF4F3; --panel:#FFFFFF; --panel-2:#F6FAF9;
    --ink:#14302D; --ink-2:#5D7B77; --ink-3:#8AA5A1;
    --line:#DBE6E4; --line-2:#EDF3F2;
    --accent:#0E7C74; --accent-soft:#D8EDEA; --accent-ink:#0A5B55; --on-accent:#FFFFFF;
    --good:#2F8757; --crit:#C0392B; --warn:#B77505;
    --done:#FCEDF2; --done-2:#F8DFE8; --done-line:#F0CFDB; --done-ink:#8A5A6B; --done-track:#F3D3DE;
    --chip-bg:#EDF3F2; --chip-ink:#5D7B77;
    --pink-bg:#FBE3EC; --pink-ink:#9C4D66;
    --red-bg:#FBE9E7; --red-ink:#C0392B; --red-line:#F0C9C4;
    --amber-bg:#FCF2DF; --amber-ink:#B77505;
    --hot-bg:#FEF7F6; --hot-lab:#A6584F;
    --warn-bg:#FDF1EF; --warn-line:#F3D5CF; --warn-ink:#8A4A3E;
    --bar-bg:rgba(255,255,255,.82);
    --weave-1:rgba(20,48,45,.035); --weave-2:rgba(20,48,45,.025);
    --pocket-a:#FBFDFC; --pocket-b:#F3F8F7;
    --cell-out:#FAFCFC; --box-line:#B9CCC9; --disabled:#C3D6D3;
    --scroll-track:#E4EDEB; --orn-stroke:#0E7C74;
    --coat:#17B3AE;   /* the lab coat's colour, set from Settings */
    --orn-bg:.20; --orn-art:.42; --orn-weave:1;
    --shadow-1:0 1px 2px rgba(20,48,45,.08);
    --shadow-2:0 2px 6px rgba(20,48,45,.08), 0 14px 34px rgba(20,48,45,.10);
    color-scheme:light;
  }

  :root[data-app="dark"]{
    --bg:#0A1214; --panel:#111D1E; --panel-2:#162425;
    --ink:#DFEAE8; --ink-2:#94ABA8; --ink-3:#6E8683;
    --line:#22322F; --line-2:#1B2A28;
    --accent:#3FBFB2; --accent-soft:#11302D; --accent-ink:#7FD8CE; --on-accent:#04201D;
    --good:#4FB37A; --crit:#EE7A68; --warn:#DCA23F;
    --done:#2B1A22; --done-2:#35202A; --done-line:#4A2C38; --done-ink:#E2A7BA; --done-track:#4A2C38;
    --chip-bg:#1C2B29; --chip-ink:#94ABA8;
    --pink-bg:#3A2029; --pink-ink:#EFAFC3;
    --red-bg:#3A1F1B; --red-ink:#F59485; --red-line:#5A2E27;
    --amber-bg:#33270F; --amber-ink:#E4B462;
    --hot-bg:#1E1414; --hot-lab:#E0968A;
    --warn-bg:#2A1B17; --warn-line:#4A2D25; --warn-ink:#EDAE9F;
    --bar-bg:rgba(10,18,20,.82);
    --weave-1:rgba(255,255,255,.028); --weave-2:rgba(255,255,255,.020);
    --pocket-a:#162526; --pocket-b:#101C1D;
    --cell-out:#0D1718; --box-line:#3A4D4A; --disabled:#294240;
    --scroll-track:#22322F; --orn-stroke:#3FBFB2;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 8px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}

  /* ═════════ scrollbars: a capsule running down an IV line ═════════ */
  *{scrollbar-width:thin;scrollbar-color:#CE6D90 var(--scroll-track)}
  ::-webkit-scrollbar{width:13px;height:13px;background:transparent}
  ::-webkit-scrollbar-track{
    background-image:linear-gradient(90deg,transparent 0 5px,var(--scroll-track) 5px 8px,transparent 8px 13px);
    background-color:transparent;
  }
  ::-webkit-scrollbar-track:horizontal{
    background-image:linear-gradient(180deg,transparent 0 5px,var(--scroll-track) 5px 8px,transparent 8px 13px);
  }
  ::-webkit-scrollbar-thumb{
    border:3px solid transparent;background-clip:padding-box;border-radius:999px;
    background-image:linear-gradient(180deg,#E4749B 0 50%,#17B3AE 50% 100%);
  }
  ::-webkit-scrollbar-thumb:horizontal{background-image:linear-gradient(90deg,#E4749B 0 50%,#17B3AE 50% 100%)}
  ::-webkit-scrollbar-thumb:hover{border-width:2px}
  ::-webkit-scrollbar-corner{background:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Figtree", ui-sans-serif, system-ui, sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

  /* ═════════ shell ═════════ */
  .app{height:100%;display:grid;grid-template-columns:222px minmax(0,1fr)}
  @media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

  /* ─── sidebar / white coat ─── */
  /* the coat: a tinted fabric weave, its colour picked in Settings */
  .side{
    position:relative;display:flex;flex-direction:column;gap:13px;min-height:0;
    padding:14px 10px 12px;border-right:1px solid var(--line);overflow-y:auto;
    background-color:color-mix(in srgb, var(--coat) 6%, var(--panel));
    background-image:
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--coat) 15%, transparent) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--coat) 11%, transparent) 0 1px, transparent 1px 4px);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;letter-spacing:-.01em;padding:2px 6px}
  .mark{width:25px;height:25px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
  .navgrp{display:flex;flex-direction:column;gap:1px}
  .navlabel{
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
    padding:4px 8px 5px;display:flex;align-items:center;gap:6px;
  }
  .navlabel button{
    margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:10.5px;
    letter-spacing:.04em;text-transform:none;font-weight:600;padding:0;
  }
  .nav{
    display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--ink-2);
    border:0;background:transparent;width:100%;text-align:left;font-size:13px;position:relative;
  }
  .nav:hover{background:var(--panel-2)}
  .nav .pip{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--ink-3))}
  .nav .ct{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .nav[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .nav[aria-pressed="true"] .ct{color:var(--accent-ink)}
  .nav.dim{opacity:.42}
  .nav.dim .pip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c,var(--ink-3))}
  .nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .course-line{display:flex;align-items:center;gap:0;border-radius:7px}
  .course-line:hover{background:var(--panel-2)}
  .course-line .nav:hover{background:transparent}
  .course-line .cog{
    border:0;background:transparent;color:var(--ink-3);font-size:11px;padding:4px 7px;opacity:0;flex:none;border-radius:6px;
  }
  .course-line:hover .cog{opacity:1}
  .course-line .cog:hover{color:var(--accent)}
  .addcourse{
    border:1px dashed var(--line);background:transparent;color:var(--ink-2);border-radius:7px;
    padding:5px 8px;font-size:12px;text-align:left;margin-top:3px;
  }
  .addcourse:hover{border-color:var(--accent);color:var(--accent)}

  .seg{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
  .seg button{flex:1;font-size:11.5px;padding:4px 6px;border:0;border-radius:6px;background:transparent;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}

  .pocket{
    margin-top:auto;position:relative;border:1px solid color-mix(in srgb, var(--coat) 26%, var(--line));
    border-top-width:2px;border-top-color:color-mix(in srgb, var(--coat) 40%, var(--line));
    border-radius:3px 3px 8px 8px;padding:10px 11px 12px;
    background:linear-gradient(color-mix(in srgb, var(--coat) 7%, var(--pocket-a)), color-mix(in srgb, var(--coat) 14%, var(--pocket-b)));
  }
  .pocket::before{content:"";position:absolute;left:7px;right:7px;top:4px;border-top:1px dashed color-mix(in srgb, var(--coat) 62%, transparent)}
  .pocket .embroidery{
    font-family:"Spectral",Georgia,serif;font-style:italic;font-weight:600;font-size:13.5px;
    color:color-mix(in srgb, var(--coat) 74%, var(--ink));
  }
  .pocket .editcoat{
    border:0;background:transparent;color:var(--ink-3);font-size:10px;padding:0 3px;
    opacity:0;vertical-align:middle;
  }
  .pocket:hover .editcoat,.pocket .editcoat:focus-visible{opacity:1}
  .pocket .editcoat:hover{color:var(--accent)}
  .pocket .role{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
  .pocket .pen{position:absolute;right:12px;top:-7px;width:9px;height:40px;border-radius:2px 2px 4px 4px;background:#3C6E8F}
  .pocket .pen::after{content:"";position:absolute;left:1px;right:1px;top:-6px;height:13px;border-radius:3px;background:#B9C7CC}
  .pocket .tuck{position:absolute;right:27px;bottom:5px;width:50px;height:28px;color:var(--accent);opacity:var(--orn-art)}

  /* ─── content ─── */
  /* min-height:0 matters — without it a grid item refuses to shrink below its
     content, the scroll area never gets a height, and tall views can't scroll. */
  .content{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;isolation:isolate}
  #orn{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:var(--orn-bg);pointer-events:none}
  .bar,.scroll{position:relative;z-index:1}
  .bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;
    border-bottom:1px solid var(--line);background:var(--bar-bg);backdrop-filter:blur(6px);
  }
  .menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;line-height:1}
  @media (max-width:900px){.menu-btn{display:block}}
  .title-grp{min-width:0}
  .h1{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0;white-space:nowrap}
  .sub{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub:empty{display:none}
  .navdate{display:flex;gap:2px;align-items:center}
  .navdate button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--ink-2)}
  .navdate button:hover{border-color:var(--accent);color:var(--accent)}
  .grow{flex:1 1 20px}
  .search{position:relative;flex:0 1 200px;min-width:126px}
  .search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12.5px}
  .search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-3)}
  .btn{border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:12.5px;padding:7px 13px;white-space:nowrap}
  .btn:hover{background:var(--accent-ink)}
  .btn:disabled{background:var(--disabled);cursor:not-allowed}
  .btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent);background:var(--panel)}
  .btn.danger{background:var(--crit);color:#fff}
  .btn.danger:hover{background:color-mix(in srgb, var(--crit) 82%, #000)}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--ink-2);letter-spacing:.04em}
  /* the frame never scrolls — the view region inside it does */
  .scroll{flex:1;min-height:0;overflow:hidden;padding:14px 16px 14px;display:flex;flex-direction:column;gap:13px}
  #viewRoot{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
  #viewRoot.fixed{overflow:hidden;display:flex;flex-direction:column}
  .drape{position:absolute;right:6px;top:-10px;width:270px;max-width:46%;height:auto;color:var(--accent);opacity:var(--orn-art);pointer-events:none;z-index:0}

  /* ─── stats ─── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;position:relative;z-index:1}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;position:relative;overflow:hidden;min-width:0}
  .stat .lab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .stat .val{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
  .stat .val small{font-size:11px;font-weight:500;color:var(--ink-2)}
  .stat .foot{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.hot{border-color:var(--red-line);background:var(--hot-bg)}
  .stat.hot .val{color:var(--crit)}
  .stat.hot .lab{color:var(--hot-lab)}
  .ecg{display:block;width:100%;height:16px;color:var(--crit);margin-top:1px}
  .mol{position:absolute;right:-12px;bottom:-16px;width:74px;height:74px;color:var(--accent);opacity:calc(.6*var(--orn-art))}

  /* quote tile — sits in the stats strip, click for the next one */
  .stat.qcard{
    grid-column:span 2;display:flex;flex-direction:column;justify-content:center;gap:5px;
    text-align:left;padding:11px 14px 12px;font:inherit;cursor:pointer;
    background:linear-gradient(135deg, var(--panel) 40%, color-mix(in srgb, var(--accent) 7%, var(--panel)));
    border-color:color-mix(in srgb, var(--accent) 24%, var(--line));
  }
  .stat.qcard:hover{border-color:color-mix(in srgb, var(--accent) 52%, var(--line))}
  .stat.qcard .qm{
    position:absolute;right:9px;top:-10px;font-family:"Spectral",Georgia,serif;font-size:62px;line-height:1;
    color:color-mix(in srgb, var(--accent) 15%, transparent);pointer-events:none;
  }
  .stat.qcard .qt{
    font-family:"Spectral",Georgia,serif;font-style:italic;font-size:13.5px;line-height:1.45;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    padding-right:26px;text-wrap:pretty;
  }
  .stat.qcard .qs{
    display:flex;align-items:baseline;gap:8px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .stat.qcard .qs::before{content:"—";letter-spacing:0;opacity:.7}
  .stat.qcard .qs em{margin-left:auto;font-style:normal;letter-spacing:.04em;opacity:.8;font-variant-numeric:tabular-nums}
  .stat.qcard.empty .qt{color:var(--ink-3)}
  @media (max-width:560px){.stat.qcard{grid-column:span 2}}

  /* ─── panels ─── */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 256px;gap:13px;align-items:start}
  @media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}
  .aside-col{display:grid;gap:13px;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;min-width:0}
  .panel+.panel{margin-top:13px}
  .ph{
    display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
  }
  .ph em{font-style:normal;margin-left:auto;font-size:10px;color:var(--ink-3);letter-spacing:.04em}
  .helix-rule{display:block;width:100%;height:11px;color:var(--accent);opacity:calc(.8*var(--orn-art))}

  .day{
    padding:6px 13px 5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    color:var(--ink-2);background:var(--panel-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;gap:8px;align-items:center;
  }
  .day.is-today{color:var(--accent-ink);background:var(--accent-soft)}
  .day .today-tag{font-size:9px;letter-spacing:.1em;border:1px solid currentColor;border-radius:999px;padding:0 5px}
  .day .classes{font-size:9.5px;letter-spacing:.04em;text-transform:none;color:var(--ink-3);font-weight:500}
  .day .add{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:14px;line-height:1;padding:0 2px}
  .day .add:hover{color:var(--accent)}

  .row{
    display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:11px;padding:9px 13px;align-items:baseline;
    width:100%;border:0;background:transparent;text-align:left;border-left:3px solid transparent;
  }
  .row+.row{border-top:1px solid var(--line-2)}
  .row:hover{background:var(--panel-2)}
  .row.tint{border-left-color:var(--c)}
  .row.complete{background:var(--done)}
  .row.complete:hover{background:var(--done-2)}
  .row.complete+.row.complete{border-top-color:var(--done-line)}
  .row .when{font-size:11px;color:var(--ink-2);padding-top:1px}
  .row .what{min-width:0}
  .row .t{font-weight:600;display:block;overflow-wrap:anywhere}
  .row .m{font-size:11px;color:var(--ink-2);display:block;overflow-wrap:anywhere}
  .row.complete .m{color:var(--done-ink)}
  .row .t.struck{text-decoration:line-through;color:var(--ink-2);font-weight:500}
  .badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .chip{
    font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;
    border-radius:999px;white-space:nowrap;background:var(--chip-bg);color:var(--chip-ink);border:1px solid transparent;
  }
  .chip.type{background:color-mix(in srgb, var(--c) 14%, var(--panel));color:color-mix(in srgb, var(--c) 80%, var(--ink))}
  .chip.st-todo{background:var(--chip-bg);color:var(--chip-ink)}
  .chip.st-submitted,.chip.st-graded,.chip.st-done{background:var(--pink-bg);color:var(--pink-ink)}
  .chip.st-missed{background:var(--red-bg);color:var(--red-ink)}
  .chip.overdue{background:var(--red-bg);color:var(--red-ink);border-color:var(--red-line)}
  .chip.soon{background:var(--amber-bg);color:var(--amber-ink)}
  .empty{padding:22px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
  .empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}

  .oh{width:100%;border-collapse:collapse;font-size:11.5px}
  .oh th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-3);padding:6px 13px}
  .oh td{padding:7px 13px;vertical-align:top}
  .oh tr+tr td{border-top:1px solid var(--line-2)}
  .oh tbody tr:hover{background:var(--panel-2);cursor:pointer}
  .oh .w{white-space:nowrap;color:var(--ink-2);font-size:11px}
  .oh .dept{color:var(--ink-3)}
  .oh .next{position:relative;padding-left:31px}
  .oh .next .mini-scope{position:absolute;left:11px;top:6px;width:15px;height:15px;color:var(--accent);opacity:calc(var(--orn-art)+.4)}

  .task{display:flex;gap:9px;padding:7px 13px;align-items:flex-start;font-size:12.5px}
  .task+.task{border-top:1px solid var(--line-2)}
  .task:hover{background:var(--panel-2)}
  .task.done{background:var(--done)}
  .task.done:hover{background:var(--done-2)}
  .box{
    width:14px;height:14px;flex:none;margin-top:2px;border-radius:4px;border:1.5px solid #B9CCC9;
    background:transparent;padding:0;display:grid;place-items:center;
  }
  .box{border-color:var(--box-line)}
  .box[aria-pressed="true"]{background:#D2748F;border-color:#D2748F}
  .box svg{width:9px;height:9px;color:#fff;opacity:0}
  .box[aria-pressed="true"] svg{opacity:1}
  .task .tx{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
  .task.done .tx{text-decoration:line-through;color:var(--done-ink)}
  .task .meta{font-size:10.5px;color:var(--ink-3)}
  .steroid{position:absolute;right:8px;bottom:6px;width:88px;height:58px;color:var(--accent);opacity:calc(.5*var(--orn-art));pointer-events:none}
  .quick{display:flex;gap:7px;padding:9px 13px;border-top:1px solid var(--line-2)}

<script>
  /* Resolve the theme before the app paints, so there is no flash of the wrong one.
     "system" follows the viewer's own setting: the host stamps data-theme when it is
     explicit, and prefers-color-scheme decides otherwise. */
  (function () {
    var pref = 'system';
    try {
      var raw = localStorage.getItem('rounds.proto.v2');
      if (raw) { var p = JSON.parse(raw); if (p && p.ui && p.ui.theme) pref = p.ui.theme; }
    } catch (e) {}
    window.__roundsTheme = pref;
    window.__roundsApplyTheme = function (choice) {
      var root = document.documentElement, host = root.getAttribute('data-theme'), dark;
      if (choice === 'dark') dark = true;
      else if (choice === 'light') dark = false;
      else if (host === 'dark') dark = true;
      else if (host === 'light') dark = false;
      else dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-app', dark ? 'dark' : 'light');
    };
    window.__roundsApplyTheme(pref);
  })();
</script>

    var fresh = seed();

      if (!c.meetings) {

        fresh.courses.forEach(function(f){ if (f.id === c.id) match = f; });
        c.meetings = match ? match.meetings : [];

    if (it.recur !== 'weekly') return (it.date >= from && it.date <= to) ? [{ item:it, date:it.date }] : [];

    while (d.getDay() !== it.weekday && g++ < 8) d = addDays(d,1);

    var tasks = data.items.filter(function(it){ return it.type==='task' && (ui.course==='all'||it.course===ui.course) && matchSearch(it); })

        + '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 6.5l2.6 2.6L10 3.5"/></svg></button>'
        + '<span class="tx" data-id="'+it.id+'">'+esc(it.title)

      + '<path d="M50 32l17-8 13 11-5 17-17 3-8-15"/><path d="M80 35l16-4 8 12-11 11-13-5z"/></svg></div>';

    return '<div class="cols">'+sched+'<div class="aside-col">'+ohHtml+tHtml+'</div></div>';

  /* ═════════ month = class schedule only ═════════ */
  function renderMonth(){
    var a = parse(ui.anchor), first = new Date(a.getFullYear(), a.getMonth(), 1);
    var gridStart = monday(first), cells = 42, all = classes();
    var byDow = {};
    all.forEach(function(x){ (byDow[x.mtg.weekday] = byDow[x.mtg.weekday] || []).push(x); });

    var html = '<div class="panel"><div class="ph">Class schedule <em>'+all.length+' weekly class'+(all.length===1?'':'es')+'</em></div><div class="month">';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){ html += '<div class="mhead">'+d+'</div>'; });
    for (var i=0;i<cells;i++){
      var d = addDays(gridStart,i), key = iso(d), out = d.getMonth() !== a.getMonth();
      var rows = byDow[d.getDay()] || [];
      html += '<button class="cell'+(out?' out':'')+(key===TODAY?' is-today':'')+'" type="button" data-day="'+key+'">'
        + '<span class="dnum">'+d.getDate()+'</span>';
      rows.slice(0,3).forEach(function(x){
        html += '<span class="mchip" style="--c:'+x.course.color+'"><b>'+hhmm(x.mtg.start)+'</b> '+esc(x.course.code)
          + ' <span class="rm">'+esc(x.mtg.room||'')+'</span></span>';
      });
      if (rows.length > 3) html += '<span class="more">+'+(rows.length-3)+' more</span>';
      html += '</button>';
    }
    html += '</div></div>';

    /* weekly timetable, Mon–Sat (Sunday only if a class lands there) */
    var days = [1,2,3,4,5,6,0].filter(function(w){ return w!==0 && w!==6 || (byDow[w]||[]).length; });
    var tt = '<div class="panel"><div class="ph">Weekly timetable <em>time · room</em></div><div class="tt">';
    days.forEach(function(w){
      var rows = (byDow[w] || []).slice().sort(function(x,y){ return x.mtg.start < y.mtg.start ? -1 : 1; });
      var hrs = rows.reduce(function(s,x){ return s + dur(x.mtg.start, x.mtg.end); }, 0);
      tt += '<div class="ttcol"><div class="ttday">'+DOW[w]+'<em>'+(hrs?Math.round(hrs*10)/10+' h':'—')+'</em></div>';
      if (!rows.length) tt += '<div class="ttnone">No classes</div>';
      rows.forEach(function(x){
        tt += '<button class="ttcard" type="button" data-editcourse="'+x.course.id+'" style="--c:'+x.course.color+'">'
          + '<span class="tm">'+hhmm(x.mtg.start)+'–'+hhmm(x.mtg.end)+'</span> <span class="kd">'+esc(x.mtg.kind||'Class')+'</span>'
          + '<span class="nm">'+esc(x.course.name)+'</span>'
          + '<span class="rm">'+esc(x.mtg.room || 'Room not set')+(x.course.instructor?' · '+esc(x.course.instructor):'')+'</span></button>';
      });
      tt += '</div>';
    });
    tt += '</div></div>';

    return html + tt;
  }

  /* ═════════ table ═════════ */
  function renderTable(){
    var rows = data.items.filter(passFilters), k = ui.sort.key, dir = ui.sort.dir;
    rows.sort(function(a,b){
      var va, vb;
      if (k==='title'){ va=a.title.toLowerCase(); vb=b.title.toLowerCase(); }
      else if (k==='type'){ va=a.type; vb=b.type; }
      else if (k==='course'){ va=(course(a.course)||{name:'zz'}).name; vb=(course(b.course)||{name:'zz'}).name; }
      else if (k==='status'){ va=statusLabel(a); vb=statusLabel(b); }
      else { va=a.date; vb=b.date; }
      return (va<vb?-1:va>vb?1:0)*dir;
    });
    function th(key,label){
      var on = k===key;
      return '<th><button type="button" data-sort="'+key+'">'+label+(on?'<span class="ar">'+(dir>0?'↑':'↓')+'</span>':'')+'</button></th>';
    }
    var html = '<div class="panel fill"><div class="ph">All items <em>'+rows.length+' shown of '+data.items.length+'</em></div>'
      + '<div class="tablewrap"><table class="tbl"><thead><tr>'
      + th('title','Item')+th('type','Type')+th('course','Course')+th('date','Date')
      + '<th>Time</th><th>Where</th>'+th('status','Status')+'</tr></thead><tbody>';
    if (!rows.length) html += '<tr><td colspan="7"><div class="empty"><b>Nothing matches</b>Clear the search or turn a filter back on.</div></td></tr>';
    rows.forEach(function(it){
      var m = tmeta(it.type), c = course(it.course), d = parse(it.date);
      var stChip = isOverdue(it) ? '<span class="chip overdue">Overdue</span>'
        : '<span class="chip st-'+it.status+'">'+esc(statusLabel(it))+(it.status==='graded'&&typeof it.grade==='number'?' '+it.grade+'%':'')+'</span>';
      html += '<tr data-id="'+it.id+'" class="'+(isComplete(it)?'complete':'')+'">'
        + '<td><b style="font-weight:600">'+esc(it.title)+'</b>'+(it.checklist&&it.checklist.length?'<br>'+stepsHtml(it):'')+'</td>'
        + '<td><span class="chip type" style="--c:'+m.color+'">'+esc(m.label)+'</span></td>'
        + '<td>'+(c?'<span class="course-tag" style="--c:'+c.color+'"><i></i>'+esc(c.code)+'</span>':'<span style="color:var(--ink-3)">—</span>')+'</td>'
        + '<td class="num mono">'+(it.recur==='weekly'?'Weekly · '+DOW[it.weekday]:DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3))+'</td>'
        + '<td class="num mono">'+(it.start?hhmm(it.start)+(it.end?'–'+hhmm(it.end):''):(it.end?hhmm(it.end):'—'))+'</td>'
        + '<td class="num">'+esc(it.where||'—')+'</td>'
        + '<td>'+stChip+'</td></tr>';
    });
    return html+'</tbody></table></div></div>';
  }

  function saveCourse(){

    data.courses = data.courses.map(function(x){ if (x.id === c.id) { found = true; return c; } return x; });

    if ((el = e.target.closest('[data-setopen]'))) { openSettings('o-name'); return; }
    if (e.target.closest('[data-quotenext]')) {
      var n = (data.quotes || []).length;
      if (n > 1) { ui.quoteIx = (ui.quoteIx + 1) % n; renderQuote(); } else openSettings('qText');
      return;

    if ((el = e.target.closest('[data-coatcolor]'))) {

    if ((el = e.target.closest('[data-qx]'))) {
      data.quotes = (data.quotes || []).filter(function(q){ return q.id !== el.dataset.qx; });
      if (ui.quoteIx >= data.quotes.length) ui.quoteIx = 0;
      save(); renderSettings(); renderQuote(); return;
    }
    if ((el = e.target.closest('[data-add]'))) { e.stopPropagation(); newItem(el.dataset.add); return; }
    if ((el = e.target.closest('[data-toggle]'))) {
      var id = el.dataset.toggle;
      data.items.forEach(function(x){ if (x.id === id) x.status = isOpen(x) ? 'done' : 'todo'; });
      save(); render(); return;
    }
    if ((el = e.target.closest('.row, tbody tr[data-id], .task .tx, .oh tbody tr'))) {
      var host = el.dataset.id ? el : el.closest('[data-id]');

    if ((el = e.target.closest('[data-sort]'))) {

      renderView(); return;

    if ((el = e.target.closest('[data-act]'))) {
      var act = el.dataset.act, it = current();
      if (act === 'close' || act === 'cancel') closeDrawer();

      else if (act === 'delete') { ui.confirm = 'item'; renderDrawer(); }
      else if (act === 'keep') { ui.confirm = null; ui.courseDraft ? renderCourseDrawer() : renderDrawer(); }
      else if (act === 'delete-yes' && it) {
        data.items = data.items.filter(function(x){ return x.id !== it.id; });
        save(); closeDrawer();
      }
      else if (act === 'addmtg' && ui.courseDraft) {
        ui.courseDraft.meetings = ui.courseDraft.meetings || [];

      else if (act === 'course-save') saveCourse();
      else if (act === 'course-delete') { ui.confirm = 'course'; renderCourseDrawer(); }
      else if (act === 'course-delete-yes' && ui.courseDraft) {
        var cid = ui.courseDraft.id;
        data.courses = data.courses.filter(function(x){ return x.id !== cid; });
        data.items.forEach(function(x){ if (x.course === cid) x.course = ''; });
        if (ui.course === cid) ui.course = 'all';
        save(); closeDrawer();
      }
      return;
    }
    if ((el = e.target.closest('[data-cl]'))) {
      var s = current(); if (!s) return;
      s.checklist.forEach(function(x){ if (x.id === el.dataset.cl) x.done = !x.done; });
      if (!ui.draft) save();
      renderDrawer(); renderStats(); renderView(); return;
    }
    if ((el = e.target.closest('[data-clx]'))) {

      if (!ui.draft) save();
      renderDrawer(); renderView(); return;

      var s3 = current(); if (!s3) return;

      if (!ui.draft) save();

      if (prev) prev.textContent = e.target.value;
      save(); renderSidebar(); return;

      ui.courseDraft[d.cf] = e.target.value;

      return;

    if (d.f) {                              /* item fields */

  document.addEventListener('keydown', function (e) {

  /* ═════════ background biomolecules ═════════ */
  var canvas = document.getElementById('orn'), ctx = canvas.getContext('2d'), hostEl = canvas.parentNode;
  function hex(cx,cy,r,rot){ var p=[],i,a; for(i=0;i<6;i++){ a=rot+i*Math.PI/3; p.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); } return p; }
  function poly(pts,close){ ctx.beginPath(); pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); if(close)ctx.closePath(); ctx.stroke(); }
  function helix(x,y,len,amp,turns,angle){
    var steps=200, ca=Math.cos(angle), sa=Math.sin(angle);
    function pt(t,ph){ var al=t*len, off=amp*Math.sin(t*turns*Math.PI*2+ph); return [x+al*ca-off*sa, y+al*sa+off*ca]; }
    [0,Math.PI].forEach(function(ph){
      ctx.beginPath();
      for (var i=0;i<=steps;i++){ var s=pt(i/steps,ph); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }
      ctx.stroke();
    });
    for (var i=0;i<=40;i++){ var a=pt(i/40,0), b=pt(i/40,Math.PI); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
  }
