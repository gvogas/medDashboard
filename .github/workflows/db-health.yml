name: Database health
# Nightly, read-only: the live database has every migration in main, and its integrity
# checks pass (`npm run db:check -- --remote`). A failed run emails the repository owner.
# Nothing here changes a record. Uses the same two repository secrets as deploy.yml.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: No migrations are waiting
        run: |
          out=$(npx wrangler d1 migrations list DB --config wrangler.jsonc --remote 2>&1)
          echo "$out"
          if ! echo "$out" | grep -q "No migrations to apply"; then
            echo "::error::The live database is missing migrations that main has. Run the Deploy workflow, or npm run db:remote."
            exit 1
          fi

      - name: Integrity checks
        run: npm run db:check -- --remote
