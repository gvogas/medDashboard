name: Check
# Every branch and pull request. Pushes to main run the same checks inside deploy.yml,
# so they are left out here.
# Paused 2026-11-02 to save Actions minutes: runs only when started by hand (Actions › Run workflow).
# To turn it back on, put back the triggers it had:
# on:
#     push:
#       branches-ignore: [main]
#     pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  # A migration runs once per database, so one that has already run must never change:
  # the live database would keep the old version and the next fresh one would get the new.
  # New files are fine; edited, renamed or deleted ones stop the pull request.
  migrations-unchanged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Existing migrations are untouched
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- migrations/)
          if [ -n "$changed" ]; then
            echo "::error::These migrations already exist on ${{ github.base_ref }} and must not change. Add a new numbered file instead."
            echo "$changed"
            exit 1
          fi
          echo "No existing migration was changed."
